<!-- Command Code's own mark: a rounded-square frame around the ⌘ glyph.
     Normalized to tty7's 24x24 icon format: the source is a 200x200 box
     scaled by 0.12, so the frame and glyph geometry are unchanged. The
     source paints a black background with white strokes; the avatars are
     tinted flat by the app (black on the brand-yellow disc, via icon_rgb),
     so the opaque background is dropped and the strokes use the single
     sentinel colour the rest of the set uses. -->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect x="2.4" y="2.4" width="19.2" height="19.2" rx="4.56" ry="4.56" fill="none" stroke="#FF0000" stroke-width="1.68" stroke-linejoin="round"/>
<path d="M 14.4 7.2 V 16.8 A 2.4 2.4 0 1 0 16.8 14.4 H 7.2 A 2.4 2.4 0 1 0 9.6 16.8 V 7.2 A 2.4 2.4 0 1 0 7.2 9.6 H 16.8 A 2.4 2.4 0 1 0 14.4 7.2 Z" fill="none" stroke="#FF0000" stroke-width="1.68" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
